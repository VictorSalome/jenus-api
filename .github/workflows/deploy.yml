name: Deploy Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build TypeScript (GitHub Runner)
        run: pnpm run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H 136.248.109.21 >> ~/.ssh/known_hosts

      - name: Deploy to Oracle Cloud VM
        run: |
          echo "🌐 Conectando à Oracle VM..."
          ssh -i ~/.ssh/oracle.key ubuntu@136.248.109.21 'cd /home/ubuntu/jenus-api && git fetch origin main && git reset --hard origin/main && npm install --omit=dev'
          
          echo "📦 Enviando dist compilado..."
          ssh -i ~/.ssh/oracle.key ubuntu@136.248.109.21 'rm -rf /home/ubuntu/jenus-api/dist_new'
          scp -i ~/.ssh/oracle.key -r dist ubuntu@136.248.109.21:/home/ubuntu/jenus-api/dist_new
          
          echo "♻️ Atualizando dist e recarregando PM2..."
          ssh -i ~/.ssh/oracle.key ubuntu@136.248.109.21 'cd /home/ubuntu/jenus-api && rm -rf dist && mv dist_new dist && pm2 reload jenus-api && pm2 save'
          
          echo "✅ Deploy concluído com sucesso!"
