name: 🚀 Deploy to Oracle Cloud

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-deploy')"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy
        run: |
          echo "🚀 Deploying to Oracle..."
          ssh -i ~/.ssh/oracle.key ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "cd ~/jenus-api && git pull origin main && npm ci --production && pm2 reload jenus-api --update-env && pm2 save"
          echo "✅ Deploy concluído!"
